
name: Monster-1 ONNX Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-onnx:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch and ONNX
        run: |
          python -m pip install --upgrade pip
          pip install torch onnx

      - name: Check model files
        run: |
          test -f monster_chat/model.py
          test -f monster_chat/output/monster1.pt

      - name: Export Monster-1 to ONNX
        run: |
          cat > export.py <<'PY'
          import torch
          import onnx
          import sys
          from pathlib import Path

          sys.path.insert(0, "monster_chat")
          from model import Monster1

          model = Monster1()
          weights = torch.load(
              "monster_chat/output/monster1.pt",
              map_location="cpu",
              weights_only=True
          )

          model.load_state_dict(weights, strict=True)
          model.eval()

          dummy = torch.zeros((1, 16), dtype=torch.long)

          torch.onnx.export(
              model,
              dummy,
              "monster1.onnx",
              input_names=["input_ids"],
              output_names=["logits"],
              dynamic_axes={
                  "input_ids": {1: "sequence"},
                  "logits": {1: "sequence"}
              },
              opset_version=17,
              dynamo=False
          )

          onnx.checker.check_model(
              onnx.load("monster1.onnx")
          )

          print("Monster-1 ONNX successfully created!")
          PY

          python export.py

      - name: Upload ONNX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monster-1-ONNX
          path: monster1.onnx
          if-no-files-found: error
          retention-days: 30
