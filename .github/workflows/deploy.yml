
name: Monster-1 Export ONNX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install torch onnx

      - name: Find model files
        run: |
          find . -name "monster1.pt"
          find . -name "model.py"
          find . -name "config.json"

      - name: Export ONNX
        run: |
          python - <<'PY'
          import torch
          import sys
          from pathlib import Path

          files = list(Path(".").rglob("monster1.pt"))
          if not files:
              raise FileNotFoundError("monster1.pt not found")

          model_file = files[0]
          model_dir = model_file.parent

          sys.path.insert(0, str(model_dir))
          import model

          print("Available model classes:")
          print([x for x in dir(model) if x[0].isupper()])

          cls = getattr(model, "Monster1", None)
          if cls is None:
              raise RuntimeError("Monster1 class not found in model.py")

          net = cls()
          state = torch.load(model_file, map_location="cpu", weights_only=False)

          if isinstance(state, dict) and "state_dict" in state:
              state = state["state_dict"]

          net.load_state_dict(state)
          net.eval()

          dummy = torch.randint(0, 128, (1, 16))

          torch.onnx.export(
              net,
              dummy,
              "monster1.onnx",
              input_names=["input_ids"],
              output_names=["logits"],
              opset_version=17,
              dynamo=False
          )

          print("ONNX export completed")
          PY

      - name: Upload ONNX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monster-1-ONNX
          path: monster1.onnx
          if-no-files-found: error
