name: Monster-1 synthetic_test smoke pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Isolated test-only mode; does not train on or qualify as real data
        required: true
        type: choice
        options:
          - synthetic_test
        default: synthetic_test
      steps:
        description: Small from-scratch optimizer-step budget for a smoke test
        required: true
        type: number
        default: 12

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  synthetic-test:
    if: ${{ inputs.mode == 'synthetic_test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned CPU runtime dependencies
        id: dependencies
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run repository regression tests
        id: unit_tests
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Generate data, train from scratch, export ONNX, and infer
        id: synthetic_pipeline
        if: ${{ always() }}
        env:
          DEPENDENCY_INSTALL_OUTCOME: ${{ steps.dependencies.outcome }}
          UNIT_TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: >-
          python scripts/run_synthetic_test.py
          --mode "${{ inputs.mode }}"
          --steps "${{ inputs.steps }}"

      - name: Upload synthetic_test outputs and failure report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Monster-1-synthetic-test-${{ github.run_id }}
          path: |
            artifacts/synthetic_test/*
            reports/synthetic_test/training_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the job if regression checks or dependency installation failed
        if: ${{ always() }}
        env:
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          PIPELINE_OUTCOME: ${{ steps.synthetic_pipeline.outcome }}
        run: |
          python - <<'PY'
          import os
          failures = {
              "dependency installation": os.environ.get("DEPENDENCY_OUTCOME"),
              "unit tests": os.environ.get("TEST_OUTCOME"),
              "synthetic pipeline": os.environ.get("PIPELINE_OUTCOME"),
          }
          failed = {name: outcome for name, outcome in failures.items() if outcome != "success"}
          if failed:
              print("Workflow failed checks:", failed)
              raise SystemExit(1)
          print("All checks passed; synthetic_test remains test-only.")
          PY
