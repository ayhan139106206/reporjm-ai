name: Monster-1 gated build and validation

on:
  workflow_dispatch:
    inputs:
      corpus_url:
        description: Direct HTTPS URL to a ZIP or tar archive with the four documented corpus files
        required: false
        type: string
        default: ""
      corpus_sha256:
        description: SHA-256 checksum of that exact archive
        required: false
        type: string
        default: ""
      run_training:
        description: Start from-scratch training only after the data and compute gates pass
        required: true
        type: boolean
        default: false
      max_steps:
        description: Maximum optimizer steps; the job stops within its free-run time budget
        required: true
        type: number
        default: 220000

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CORPUS_URL: ${{ inputs.corpus_url }}
      CORPUS_SHA256: ${{ inputs.corpus_sha256 }}
      RUN_TRAINING: ${{ inputs.run_training }}
      MAX_STEPS: ${{ inputs.max_steps }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned CPU runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download verified static corpus archive (optional)
        run: |
          if [ -n "$CORPUS_URL" ] || [ -n "$CORPUS_SHA256" ]; then
            if [ -z "$CORPUS_URL" ] || [ -z "$CORPUS_SHA256" ]; then
              echo "Both corpus_url and corpus_sha256 are required together."
              exit 2
            fi
            python scripts/fetch_corpus.py --url "$CORPUS_URL" --sha256 "$CORPUS_SHA256"
          else
            echo "No corpus supplied; training will be stopped at preflight."
          fi

      - name: Run unit and export-mechanics tests
        run: python -m unittest discover -s tests -v

      - name: Check data, license, tokenizer, and compute budget
        run: >-
          python train.py preflight
          --max-steps "$MAX_STEPS"
          --github-output "$GITHUB_OUTPUT"

      - name: Run gated training
        if: ${{ env.RUN_TRAINING == 'true' }}
        run: >-
          python train.py train
          --max-steps "$MAX_STEPS"
          --time-budget-minutes 300

      - name: Export and verify ONNX only for a completed model
        if: ${{ env.RUN_TRAINING == 'true' }}
        run: |
          if [ -f artifacts/model/model_manifest.json ] && \
             python -c "import json; raise SystemExit(0 if json.load(open('artifacts/model/model_manifest.json'))['status'] == 'trained' else 1)"; then
            python export_onnx.py
          else
            echo "No completed, data-backed model; ONNX export is skipped."
          fi

      - name: Upload truthful status and model artifacts (if any)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Monster-1-build-${{ github.run_id }}
          path: |
            reports/*.json
            artifacts/model/*
          if-no-files-found: warn
          retention-days: 30
