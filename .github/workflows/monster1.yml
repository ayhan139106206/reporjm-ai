name: Monster-1 real-data training (manual)
on:
  workflow_dispatch:
    inputs:
      run_training:
        description: Opt in to download the pinned real corpus and run CPU training (up to 350 minutes total)
        required: true
        type: boolean
        default: false
      artifact_storage_confirmed:
        description: Confirm at least 100 MB of free Actions artifact storage remains under the 500 MB Free allowance
        required: true
        type: boolean
        default: false
      private_repo_free_budget_confirmed:
        description: For a private repository only, confirm at least 350 Linux 2-core minutes ($2.10) remain in this month's shared included compute
        required: true
        type: boolean
        default: false
      public_model_rights_reviewed:
        description: For a public repository only, confirm a separate rights and privacy review authorizes public model-weight release
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: monster1-real-data-training
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  train-real-data:
    # Standard hosted runners are free for public repositories. Private runs require an explicit free-budget attestation.
    if: ${{ inputs.run_training && inputs.artifact_storage_confirmed && (!github.event.repository.private || inputs.private_repo_free_budget_confirmed) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run real-data pipeline regression tests
        run: |
          for test_file in test_fetch_corpus.py test_model.py test_training_gate.py test_wikipedia_preparation.py; do
            python -m unittest discover -s tests -p "$test_file" -v
          done
      - name: Download and prepare pinned real Persian Wikipedia corpus
        run: python scripts/prepare_wikipedia_corpus.py all --workers 3
      - name: Check data provenance, privacy scan, tokenizer, and compute gate
        id: preflight
        run: >-
          python train.py preflight
          --max-steps 30000
          --batch-size 32
          --github-output "$GITHUB_OUTPUT"
      - name: Run gated from-scratch real-data training
        id: train
        if: ${{ steps.preflight.outputs.training_ready == 'true' }}
        run: >-
          python train.py train
          --max-steps 30000
          --batch-size 32
          --time-budget-minutes 300
      - name: Verify completed data-backed result
        id: model_check
        if: ${{ always() && steps.train.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path("reports/training_report.json")
          manifest_path = Path("artifacts/model/model_manifest.json")
          ready = False
          if report_path.is_file() and manifest_path.is_file():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              ready = (
                  report.get("status") == "trained"
                  and report.get("training_ready") is True
                  and manifest.get("status") == "trained"
                  and manifest.get("real_data") is True
                  and manifest.get("is_synthetic") is False
                  and manifest.get("pretrained_model") is False
                  and Path("artifacts/model/monster1.pt").is_file()
                  and Path("artifacts/model/monster1_tokenizer.model").is_file()
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={'true' if ready else 'false'}\n")
          print("Completed real-data training gate passed." if ready else "No completed, held-out-validated model; model export is skipped.")
          PY
      - name: Export and verify ONNX for a completed model
        id: export_onnx
        if: ${{ steps.model_check.outputs.ready == 'true' }}
        run: python export_onnx.py
      - name: Enforce model artifact size limit
        id: artifact_size
        if: ${{ steps.model_check.outputs.ready == 'true' && steps.export_onnx.outcome == 'success' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path("artifacts/model/monster1.pt"),
              Path("artifacts/model/monster1_tokenizer.model"),
              Path("artifacts/model/model_manifest.json"),
              Path("artifacts/model/monster1.onnx"),
              Path("artifacts/model/onnx_test_report.json"),
          ]
          total = sum(path.stat().st_size for path in files)
          limit = 100 * 1024 * 1024
          print(f"Model artifact total: {total:,} bytes (limit {limit:,})")
          if total > limit:
              raise SystemExit("Model artifact exceeds the 100 MiB storage guard.")
          PY
      - name: Upload compact status reports
        if: ${{ always() && inputs.artifact_storage_confirmed }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Monster-1-status-${{ github.run_id }}
          path: |
            reports/training_preflight.json
            reports/training_report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload model artifact (private repository or explicitly reviewed public release only)
        if: ${{ always() && inputs.artifact_storage_confirmed && steps.model_check.outputs.ready == 'true' && steps.export_onnx.outcome == 'success' && steps.artifact_size.outcome == 'success' && (github.event.repository.private || inputs.public_model_rights_reviewed) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Monster-1-real-model-${{ github.run_id }}
          path: |
            artifacts/model/monster1.pt
            artifacts/model/monster1_tokenizer.model
            artifacts/model/model_manifest.json
            artifacts/model/monster1.onnx
            artifacts/model/onnx_test_report.json
          if-no-files-found: error
          retention-days: 7
      - name: Explain why model weights were not uploaded
        if: ${{ always() && steps.model_check.outputs.ready == 'true' && steps.export_onnx.outcome == 'success' && !github.event.repository.private && !inputs.public_model_rights_reviewed }}
        run: echo "Weights remain in the ephemeral runner because this repository is public and public rights/privacy review was not confirmed. No model files were committed."
      - name: Mark incomplete training or export as failed
        if: always()
        env:
          MODEL_READY: ${{ steps.model_check.outputs.ready }}
          EXPORT_OUTCOME: ${{ steps.export_onnx.outcome }}
          ARTIFACT_SIZE_OUTCOME: ${{ steps.artifact_size.outcome }}
        run: |
          if [ "$MODEL_READY" = "true" ] && [ "$EXPORT_OUTCOME" = "success" ] && [ "$ARTIFACT_SIZE_OUTCOME" = "success" ]; then
            echo "Real-data training and ONNX mechanics checks passed; this is not a production-quality claim."
          else
            echo "::error::Training did not complete the real-data and held-out-loss gates, or ONNX export verification failed."
            exit 1
          fi
